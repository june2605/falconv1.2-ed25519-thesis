name: Phase 5.5A research
run-name: Phase 5.5A ${{ inputs.mode }} / ${{ inputs.source_commit }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pilot or cross-environment C8"
        type: choice
        options: [pilot, compat]
        default: pilot
      source_commit:
        description: "Exact 40-character current commit of thesis/ui-demo"
        type: string
        required: true
      pilot_run:
        description: "Exact completed pilot run ID (compat)"
        type: string
        default: ""
      pilot_attempt:
        description: "Exact completed pilot attempt (compat)"
        type: string
        default: "1"
      accepted_protocol:
        description: "Use hybridsign-5.5a-v1 after reviewing the pilot (compat)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: hybridsign-phase55a-research
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  P55_MODE: ${{ inputs.mode }}
  P55_SOURCE: ${{ inputs.source_commit }}
  P55_PILOT: ${{ inputs.pilot_run }}
  P55_ATTEMPT: ${{ inputs.pilot_attempt }}
  P55_ACCEPTED: ${{ inputs.accepted_protocol }}

jobs:
  research:
    if: github.ref == 'refs/heads/main' && github.repository == 'june2605/falconv1.2-ed25519-thesis'
    name: ${{ matrix.environment }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.mode == 'compat' && 15 || 25 }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {environment: CI-WIN, runner: windows-2022}
          - {environment: CI-LINUX, runner: ubuntu-24.04}
          - {environment: CI-MAC, runner: macos-15-intel}
    env:
      P55_ENV: ${{ matrix.environment }}
    steps:
      - name: Initialize job evidence
        run: |
          $stamps = Join-Path $env:RUNNER_TEMP 'p55-stamps'
          $evidence = Join-Path $env:RUNNER_TEMP 'p55-evidence'
          New-Item -ItemType Directory $stamps, $evidence | Out-Null
          @{utc=[DateTimeOffset]::UtcNow.ToString('o')} | ConvertTo-Json -Compress |
            Set-Content -LiteralPath (Join-Path $stamps 'job_start.json') -Encoding utf8
      - name: Resolve the reviewed research revision
        run: |
          if ($env:P55_SOURCE -cnotmatch '^[0-9a-f]{40}$') { throw 'Expected one full lowercase source SHA' }
          $remote = git ls-remote --exit-code "https://github.com/$env:GITHUB_REPOSITORY.git" refs/heads/thesis/ui-demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($remote -cne "$env:P55_SOURCE$([char]9)refs/heads/thesis/ui-demo") { throw 'Source SHA differs from the reviewed research branch tip' }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.9"
          architecture: x64
      - name: Validate the exact checkout and run inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B -m research.benchmarks.p55.ci gate --mode "$env:P55_MODE" --source "$env:P55_SOURCE" --pilot-run="$env:P55_PILOT" --pilot-attempt="$env:P55_ATTEMPT" --accepted-protocol="$env:P55_ACCEPTED"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record workflow and checkout provenance
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'p55-evidence'
          @{
             workflow_sha=$env:GITHUB_WORKFLOW_SHA; workflow_ref=$env:GITHUB_WORKFLOW_REF
             source_sha=(git rev-parse HEAD); mode=$env:P55_MODE; environment=$env:P55_ENV
             run_id=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT
             runner_os=$env:RUNNER_OS; runner_arch=$env:RUNNER_ARCH
             image_os=$env:ImageOS; image_version=$env:ImageVersion
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $evidence 'workflow.json') -Encoding utf8
      - name: Install the verified wheels
        run: |
          $stamps = Join-Path $env:RUNNER_TEMP 'p55-stamps'
          $venv = Join-Path $env:RUNNER_TEMP 'p55-venv'
          $wheels = Join-Path $env:RUNNER_TEMP 'p55-wheels'
          python -B -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = if ($IsWindows) {'Scripts/python.exe'} else {'bin/python'}
          $p55 = Join-Path $venv $exe
          "P55_PYTHON=$p55" >> $env:GITHUB_ENV
          "P55_WHEELS=$wheels" >> $env:GITHUB_ENV
          & $p55 -B -m research.benchmarks.p55.ci stamp --directory $stamps --stage setup_end
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $p55 -B -m research.benchmarks.p55 install-wheels --wheelhouse $wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $p55 -B -m research.benchmarks.p55.ci stamp --directory $stamps --stage install_end
          exit $LASTEXITCODE
      - name: Research and production boundary tests
        run: |
          & $env:P55_PYTHON -B -m pytest -q -p no:cacheprovider tests/test_research_phase55.py tests/test_signature_pair.py tests/test_container_parsing.py tests/test_completed_signatures.py tests/test_key_material.py tests/test_transactional_signing.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:P55_PYTHON -B -m research.benchmarks.p55 smoke --environment $env:P55_ENV --wheelhouse $env:P55_WHEELS --output (Join-Path $env:RUNNER_TEMP 'p55-evidence/smoke')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:P55_PYTHON -B -m research.benchmarks.p55.ci stamp --directory (Join-Path $env:RUNNER_TEMP 'p55-stamps') --stage test_end
          exit $LASTEXITCODE
      - name: Run one paired measurement session
        if: inputs.mode == 'pilot'
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'p55-evidence'
          $session = Join-Path $evidence 'session'
          $seed = & $env:P55_PYTHON -B -m research.benchmarks.p55.ci seed --environment $env:P55_ENV --slot 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:P55_PYTHON -B -m research.benchmarks.p55 run --mode pilot --seed $seed --environment $env:P55_ENV --wheelhouse $env:P55_WHEELS --output $session
          $measureExit = $LASTEXITCODE
          & $env:P55_PYTHON -B -m research.benchmarks.p55.ci stamp --directory (Join-Path $env:RUNNER_TEMP 'p55-stamps') --stage benchmark_end
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit $measureExit
      - name: Check and summarize preserved session
        if: always() && inputs.mode == 'pilot' && env.P55_PYTHON != ''
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'p55-evidence'
          $session = Join-Path $evidence 'session'
          if (Test-Path -LiteralPath (Join-Path $session 'checksums.sha256')) {
            & $env:P55_PYTHON -B -m research.benchmarks.p55 check-inventory --campaign $session
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $env:P55_PYTHON -B -m research.benchmarks.p55 summarize --campaign $session --output (Join-Path $evidence 'summary.json')
            exit $LASTEXITCODE
          }
          Write-Output 'Session inventory unavailable. Retain any partial evidence and job log.'
      - name: Export the small public pilot bundle
        if: inputs.mode == 'pilot'
        run: |
          & $env:P55_PYTHON -B -m research.benchmarks.p55 export-bundle --environment $env:P55_ENV --wheelhouse $env:P55_WHEELS --output (Join-Path $env:RUNNER_TEMP 'p55-bundle')
          exit $LASTEXITCODE
      - name: Upload exact pilot producer bundle
        if: inputs.mode == 'pilot'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: p55a-${{ inputs.source_commit }}-${{ github.run_id }}-a${{ github.run_attempt }}-${{ matrix.environment }}-c8
          path: |
            ${{ runner.temp }}/p55-bundle/bundle.json
            ${{ runner.temp }}/p55-bundle/sample-hybrid.pdf
            ${{ runner.temp }}/p55-bundle/ed25519.pub
            ${{ runner.temp }}/p55-bundle/falcon.pub
          retention-days: 30
          if-no-files-found: error
      - name: Download bundles from the selected producer run and attempt
        if: inputs.mode == 'compat'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: p55a-${{ inputs.source_commit }}-${{ inputs.pilot_run }}-a${{ inputs.pilot_attempt }}-CI-*-c8
          merge-multiple: false
          path: ${{ runner.temp }}/p55-public-downloads
          github-token: ${{ github.token }}
          run-id: ${{ inputs.pilot_run }}
      - name: Verify the three fixed producer bundles
        if: inputs.mode == 'compat'
        run: |
          & $env:P55_PYTHON -B -m research.benchmarks.p55.ci verify-matrix --downloads (Join-Path $env:RUNNER_TEMP 'p55-public-downloads') --environment $env:P55_ENV --source $env:P55_SOURCE --run-id $env:P55_PILOT --attempt $env:P55_ATTEMPT --wheelhouse $env:P55_WHEELS --output (Join-Path $env:RUNNER_TEMP 'p55-evidence/compat.json')
          $compatExit = $LASTEXITCODE
          & $env:P55_PYTHON -B -m research.benchmarks.p55.ci stamp --directory (Join-Path $env:RUNNER_TEMP 'p55-stamps') --stage benchmark_end
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit $compatExit
      - name: Record available job stage durations
        if: always()
        run: |
          $stamps = Join-Path $env:RUNNER_TEMP 'p55-stamps'
          $out = Join-Path $env:RUNNER_TEMP 'p55-evidence/job-timings.json'
          if (Test-Path -LiteralPath 'research/benchmarks/p55/ci.py') {
            python -B -m research.benchmarks.p55.ci stamp --directory $stamps --stage job_local_end
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -B -m research.benchmarks.p55.ci job-times --directory $stamps --output $out
            exit $LASTEXITCODE
          }
          Write-Output 'Checkout unavailable. Complete job duration remains in the Actions jobs API.'
      - name: Preserve allowlisted evidence, including failed or incomplete trials
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: p55a-${{ inputs.source_commit }}-${{ github.run_id }}-a${{ github.run_attempt }}-${{ matrix.environment }}-s1
          path: |
            ${{ runner.temp }}/p55-evidence/session/session.json
            ${{ runner.temp }}/p55-evidence/session/schedule.json
            ${{ runner.temp }}/p55-evidence/session/outcome.json
            ${{ runner.temp }}/p55-evidence/session/raw.csv
            ${{ runner.temp }}/p55-evidence/session/controls.jsonl
            ${{ runner.temp }}/p55-evidence/session/progress.jsonl
            ${{ runner.temp }}/p55-evidence/session/smoke.json
            ${{ runner.temp }}/p55-evidence/session/checksums.sha256
            ${{ runner.temp }}/p55-evidence/smoke/smoke.json
            ${{ runner.temp }}/p55-evidence/summary.json
            ${{ runner.temp }}/p55-evidence/workflow.json
            ${{ runner.temp }}/p55-evidence/job-timings.json
            ${{ runner.temp }}/p55-evidence/compat.json
          retention-days: 30
          if-no-files-found: warn
